<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>MY PACE.</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#202124;background:#fafafa}*{box-sizing:border-box}body{margin:0}main{max-width:650px;margin:auto;padding:25px 18px 105px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:30px;letter-spacing:-1.5px;margin:6px 0}h2{font-size:19px;margin:0 0 14px}.muted{color:#8b8b8b;font-size:12px}.card{background:white;border:1px solid #eaeaea;border-radius:17px;padding:17px;margin:13px 0}.tabs{display:flex;gap:6px;position:sticky;top:0;background:#fafafa;padding:10px 0;z-index:3}.tabs button{flex:1}.tabs button.active{background:#222;color:white}button,input,select{font:inherit}button{border:0;background:#efefef;border-radius:10px;padding:10px 12px;cursor:pointer}input,select{border:1px solid #dedede;border-radius:10px;padding:11px;min-width:0;background:white}input[type=checkbox]{accent-color:#222;width:18px;height:18px}.form{display:flex;gap:7px;flex-wrap:wrap}.form input{flex:2;min-width:130px}.form select{flex:1}.primary{background:#222;color:white}.task{display:flex;gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid #f0f0f0}.task:last-child{border:0}.task span{flex:1;font-size:14px}.done{text-decoration:line-through;color:#aaa}.small{font-size:11px;color:#999}.block{border-left:3px solid #d7defd}.progress{height:7px;background:#eee;border-radius:8px;overflow:hidden}.progress div{height:100%;background:#222}.stat{display:flex;gap:12px}.stat .card{flex:1;margin:0}.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.day{padding:9px 2px;border-radius:9px;text-align:center;font-size:11px;background:#f1f1f1}.day.selected{background:#222;color:white}.scroll{overflow-x:auto}.weekly-grid{display:grid;grid-template-columns:repeat(7,minmax(100px,1fr));gap:3px;min-width:700px}.weekly-grid>div{background:#fff;border:1px solid #eee;padding:8px;font-size:11px;min-height:60px}.weekly-grid .head{min-height:35px;background:#eee;font-weight:600}.weekly-grid .slot{min-height:85px}.bar{height:8px;background:#e9e9e9;border-radius:6px;overflow:hidden;margin:5px 0}.bar>div{height:100%;background:#252525}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.tag{font-size:10px;background:#f0f0f0;border-radius:7px;padding:5px 7px}.delete{background:transparent;color:#aaa;padding:5px}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#fff;border-top:1px solid #eee;padding:11px 4px max(12px,env(safe-area-inset-bottom));z-index:4}.nav button{background:transparent;font-size:12px}.nav button.active{font-weight:800}.hidden{display:none}textarea{width:100%;min-height:65px;border:1px solid #ddd;border-radius:10px;padding:10px;font:inherit} .month{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.month button{padding:12px 2px;font-size:12px}.month button.selected{background:#222;color:#fff}.month button.marked{border:1px solid #999}</style></head><body><main><header><div><div class="muted">PERSONAL PLANNER / STUDY OS</div><h1>MY PACE.</h1></div><div class="muted" id="todayLabel"></div></header><div class="tabs"><button data-view="daily" class="active">하루</button><button data-view="weekly">주간</button><button data-view="monthly">월간</button><button data-view="exams">시험 · 습관</button></div><section id="daily"></section><section id="weekly" class="hidden"></section><section id="monthly" class="hidden"></section><section id="exams" class="hidden"></section></main><nav class="nav"><button data-view="daily" class="active">☀ 오늘</button><button data-view="weekly">▦ 주간</button><button data-view="monthly">▤ 월간</button><button data-view="exams">◎ 관리</button></nav><script>
const KEY='mypace_v2';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{tasks:[],habits:[],checks:{},exams:[]}}catch(e){state={tasks:[],habits:[],checks:{},exams:[]}};let date=new Date(),view='daily',monthOffset=0;const slots=['07:00–09:00','09:00–13:00','13:00–16:00','16:00–19:00','19:00–22:00','22:00–01:00'];const pad=n=>String(n).padStart(2,'0');const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const fromKey=k=>new Date(k+'T12:00:00');const shift=(d,n)=>{let a=new Date(d);a.setDate(a.getDate()+n);return a};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const tasksAt=k=>state.tasks.filter(t=>t.date===k);const count=k=>{let a=tasksAt(k);return [a.filter(t=>t.done).length,a.length]};const pct=k=>{let [a,b]=count(k);return b?Math.round(a/b*100):0};const titleDate=d=>`${d.getMonth()+1}월 ${d.getDate()}일 ${'일월화수목금토'[d.getDay()]}요일`;const taskHtml=t=>`<div class="task"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask(${t.id})"><span class="${t.done?'done':''}">${esc(t.text)}</span><button class="delete" onclick="removeTask(${t.id})">×</button></div>`;function render(){document.getElementById('todayLabel').textContent=titleDate(new Date());let k=key(date),[a,b]=count(k);document.getElementById('daily').innerHTML=`<div class="card"><div class="row"><button onclick="moveDate(-1)">‹</button><strong>${titleDate(date)}</strong><button onclick="moveDate(1)">›</button><button onclick="goToday()">오늘</button></div><p class="muted">아침에 계획하고, 시간 블록에 할 일을 배치하세요.</p><div class="row"><strong>오늘 달성률</strong><span>${a} / ${b} · ${pct(k)}%</span></div><div class="progress"><div style="width:${pct(k)}%"></div></div></div><div class="card"><h2>오늘의 할 일</h2><form class="form" onsubmit="addTask(event)"><input id="newTask" placeholder="할 일 입력" required maxlength="100"><select id="newSlot"><option value="-1">시간 미정</option>${slots.map((s,i)=>`<option value="${i}">${s}</option>`).join('')}</select><button class="primary">추가</button></form>${tasksAt(k).filter(t=>t.slot===-1).map(taskHtml).join('')||'<p class="small">시간 미정인 할 일이 없습니다.</p>'}</div><h2>6 BLOCKS <span class="muted">07:00 – 다음 날 01:00</span></h2>${slots.map((s,i)=>`<div class="card block"><div class="row"><strong>${pad(i+1)} <span class="muted">${s}</span></strong><span class="tag">${tasksAt(k).filter(t=>t.slot===i).length} tasks</span></div>${tasksAt(k).filter(t=>t.slot===i).map(taskHtml).join('')||'<p class="small">이 시간대에 할 일을 추가해 보세요.</p>'}</div>`).join('')}<p class="muted">마지막 22:00–01:00 블록은 시작한 날짜의 일정으로 기록됩니다.</p>`;
let dow=(date.getDay()+6)%7,start=shift(date,-dow),days=Array.from({length:7},(_,i)=>shift(start,i));document.getElementById('weekly').innerHTML=`<div class="card"><div class="row"><button onclick="moveDate(-7)">‹ 이전 주</button><strong>${titleDate(start)} ~ ${titleDate(days[6])}</strong><button onclick="moveDate(7)">다음 주 ›</button></div></div><div class="card"><h2>이번 주 완료 기록</h2>${days.map(d=>`<div class="row"><span>${titleDate(d)}</span><span>${count(key(d)).join(' / ')} · ${pct(key(d))}%</span></div><div class="bar"><div style="width:${pct(key(d))}%"></div></div>`).join('')}</div><h2>WEEKLY GRID</h2><p class="muted">좌우로 스크롤하면 7일의 할 일과 6개 시간 블록을 볼 수 있어요.</p><div class="scroll"><div class="weekly-grid">${days.map(d=>`<div class="head">${titleDate(d)}</div>`).join('')}${days.map(d=>`<div><b>TO DO</b><br>${tasksAt(key(d)).map(t=>`${t.done?'✓':'□'} ${esc(t.text)}<br>`).join('')||'—'}</div>`).join('')}${slots.map((s,i)=>days.map(d=>`<div class="slot"><span class="small">${s}</span><br>${tasksAt(key(d)).filter(t=>t.slot===i).map(t=>`${t.done?'✓':'□'} ${esc(t.text)}<br>`).join('')||'—'}</div>`).join('')).join('')}</div></div>`;
let base=new Date(date.getFullYear(),date.getMonth()+monthOffset,1),y=base.getFullYear(),m=base.getMonth(),last=new Date(y,m+1,0).getDate(),offset=(base.getDay()+6)%7,all=state.tasks.filter(t=>{let d=fromKey(t.date);return d.getFullYear()===y&&d.getMonth()===m}),finished=all.filter(t=>t.done).length;document.getElementById('monthly').innerHTML=`<div class="card"><div class="row"><button onclick="changeMonth(-1)">‹</button><h2>${y}년 ${m+1}월</h2><button onclick="changeMonth(1)">›</button></div><div class="row"><span>완료한 일 <b>${finished}개</b></span><span>전체 ${all.length}개</span></div><div class="progress"><div style="width:${all.length?finished/all.length*100:0}%"></div></div><div class="month">${['월','화','수','목','금','토','일'].map(d=>`<div class="small" style="text-align:center">${d}</div>`).join('')}${'<div></div>'.repeat(offset)}${Array.from({length:last},(_,i)=>{let k=key(new Date(y,m,i+1));return `<button class="${tasksAt(k).length?'marked':''} ${k===key(date)?'selected':''}" onclick="pickDay('${k}')">${i+1}<br><span class="small">${count(k)[0]}/${count(k)[1]}</span></button>`}).join('')}</div></div><div class="card"><h2>이번 달 완료한 일</h2>${all.filter(t=>t.done).sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`<div class="task"><span>✓ ${esc(t.text)}</span><span class="small">${t.date.slice(5)}</span></div>`).join('')||'<p class="small">완료한 일이 아직 없어요.</p>'}</div>`;
let today=key(new Date());document.getElementById('exams').innerHTML=`<div class="card"><h2>시험 D-DAY</h2><form class="form" onsubmit="addExam(event)"><input id="examName" placeholder="시험명" required><input id="examDate" type="date" required><button class="primary">추가</button></form>${state.exams.map(e=>{let diff=Math.round((fromKey(e.date)-fromKey(today))/86400000);return `<div class="task"><span>${esc(e.name)} <span class="small">${e.date}</span></span><b>${diff===0?'D-DAY':diff>0?'D-'+diff:'D+'+(-diff)}</b><button class="delete" onclick="removeExam(${e.id})">×</button></div>`}).join('')}</div><div class="card"><h2>습관 트래커</h2><form class="form" onsubmit="addHabit(event)"><input id="habitName" placeholder="매일 실천할 습관" required><button class="primary">추가</button></form>${state.habits.map(h=>`<div class="task"><input type="checkbox" ${state.checks[today+'_'+h.id]?'checked':''} onchange="toggleHabit(${h.id})"><span>${esc(h.name)} <span class="small">연속 ${streak(h.id)}일</span></span><button class="delete" onclick="removeHabit(${h.id})">×</button></div>`).join('')}</div>`;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));['daily','weekly','monthly','exams'].forEach(id=>document.getElementById(id).classList.toggle('hidden',id!==view))}
function addTask(e){e.preventDefault();let input=document.getElementById('newTask');state.tasks.push({id:Date.now(),text:input.value.trim(),date:key(date),slot:+document.getElementById('newSlot').value,done:false});save();render()}function toggleTask(id){let t=state.tasks.find(t=>t.id===id);if(t)t.done=!t.done;save();render()}function removeTask(id){state.tasks=state.tasks.filter(t=>t.id!==id);save();render()}function moveDate(n){date=shift(date,n);monthOffset=0;render()}function goToday(){date=new Date();monthOffset=0;render()}function changeMonth(n){monthOffset+=n;render()}function pickDay(k){date=fromKey(k);monthOffset=0;view='daily';render()}function addExam(e){e.preventDefault();state.exams.push({id:Date.now(),name:document.getElementById('examName').value,date:document.getElementById('examDate').value});save();render()}function removeExam(id){state.exams=state.exams.filter(x=>x.id!==id);save();render()}function addHabit(e){e.preventDefault();state.habits.push({id:Date.now(),name:document.getElementById('habitName').value});save();render()}function toggleHabit(id){let k=key(new Date())+'_'+id;state.checks[k]=!state.checks[k];save();render()}function removeHabit(id){state.habits=state.habits.filter(h=>h.id!==id);save();render()}function streak(id){let d=new Date(),n=0;if(!state.checks[key(d)+'_'+id])d=shift(d,-1);while(state.checks[key(d)+'_'+id]){n++;d=shift(d,-1)}return n}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});render();</script></body></html>
